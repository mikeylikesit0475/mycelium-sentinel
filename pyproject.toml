[project]
name = "mycelium-sentinel"
version = "0.0.0"
description = "Mycelium Sentinel — hardware-in-the-loop embedded workflow with no hardware."
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.uv.workspace]
members = ["sim", "ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["firmware", "renode", "deploy"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "RUF",           # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
  "RUF001", "RUF002", "RUF003",  # ambiguous unicode in strings/docstrings/comments — math notation is intentional
]

[tool.ruff.lint.isort]
known-first-party = ["sim", "ingest"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]